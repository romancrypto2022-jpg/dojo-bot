name: DOJO Daily Notifications

on:
  schedule:
    - cron: '0 6 * * *'    # 9:00 МСК — утренняя мысль дня (все дни)
    - cron: '0 17 * * *'   # 20:00 МСК — умные вечерние уведомления
    - cron: '0 14 * * 0'   # 17:00 МСК воскресенье — напоминание об аудите
  workflow_dispatch:
    inputs:
      notify_type:
        description: 'Тип уведомления'
        required: false
        default: 'morning'
        type: choice
        options: [morning, evening, audit]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Morning — мысль дня
        if: github.event.schedule == '0 6 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.notify_type == 'morning')
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          NOTIFY_TYPE: morning
        run: node send-notifications.js

      - name: Evening — умные уведомления
        if: github.event.schedule == '0 17 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.notify_type == 'evening')
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          NOTIFY_TYPE: evening
        run: node send-notifications.js

      - name: Sunday — напоминание об аудите
        if: github.event.schedule == '0 14 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.notify_type == 'audit')
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          NOTIFY_TYPE: audit
        run: node send-notifications.js
